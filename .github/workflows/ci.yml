name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go vet ./...
      - run: go build ./...
      # unit tests + hermetic provider tests (real terraform CLI against internal/fakerouter); live tests skip without ER605_ACC_*
      - run: go test ./... -race -count=1

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: go generate ./...
      - name: docs are up to date
        run: git diff --exit-code docs/
