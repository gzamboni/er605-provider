default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^docs/
      - id: end-of-file-fixer
        exclude: ^docs/
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  # Secret scanning of the staged changes (config in .gitleaks.toml).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: bash -c 'out=$(gofmt -l "$@"); [ -z "$out" ] || { echo "gofmt needed:"; echo "$out"; exit 1; }' --
        language: system
        types: [go]
      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        types: [go]
        pass_filenames: false
      - id: go-mod-tidy
        name: go mod tidy is clean
        entry: bash -c 'go mod tidy && git diff --exit-code go.mod go.sum'
        language: system
        files: ^(go\.mod|go\.sum|.*\.go)$
        pass_filenames: false
      - id: go-test
        name: go test
        entry: go test ./... -count=1
        language: system
        types: [go]
        pass_filenames: false
        stages: [pre-push]
      - id: docs-up-to-date
        name: docs/ is regenerated (go generate)
        entry: bash -c 'go generate ./... >/dev/null && git diff --exit-code docs/'
        language: system
        files: ^(internal/provider/.*\.go|examples/.*|templates/.*)$
        pass_filenames: false
        stages: [pre-push]
